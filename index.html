<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classic Party Trainer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{--bg:#0b1020;--panel:#121a2e;--panel2:#17213a;--line:#2b3a5f;--text:#eaf0ff;--muted:#97a6c7;--gold:#f5c76b;--green:#7ee787;--red:#ff7b72;--blue:#7dcfff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060a14,#0b1020 35%,#0e1528);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 12px;background:#24365f;color:var(--text)}button:hover{background:#315085}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:30px}.brand p{margin:4px 0;color:var(--muted)}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill,.card{background:rgba(18,26,46,.92);border:1px solid var(--line);box-shadow:0 10px 30px #0005}.pill{border-radius:999px;padding:8px 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{background:#111a31;border:1px solid var(--line)}.tab.active{background:#244477;border-color:#4f77c9}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{border-radius:16px;padding:16px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}@media(max-width:900px){.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}}h2,h3{margin:0 0 12px}.stat{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #223456;padding:7px 0}.stat b{color:var(--gold)}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#0a1122;color:var(--text);padding:9px}textarea{min-height:110px}.mini{color:var(--muted);font-size:13px}.good{color:var(--green)}.bad{color:var(--red)}.gold{color:var(--gold)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.cols{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #223456;padding:8px;text-align:left}th{color:var(--gold)}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quest{border:1px solid #27395f;border-radius:12px;padding:10px;margin:8px 0;background:#0b1326}.tag{display:inline-block;border:1px solid #3b5282;border-radius:999px;padding:2px 8px;margin:2px;color:#cfe0ff;font-size:12px}.imgprev{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px}.danger{background:#4a1d28}.success{background:#20492f}.note{background:#0b1326;border-left:4px solid var(--gold);padding:10px;border-radius:10px;color:#dbe7ff}.geargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gearitem{background:#0b1326;border:1px solid #223456;border-radius:10px;padding:8px}.right{text-align:right}.smallbtn{padding:6px 9px;font-size:12px}.muted{color:var(--muted)}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useMemo,useState,useEffect}=React;
const LS='classic-party-trainer-v1';
const slots=['Head','Neck','Shoulders','Back','Chest','Wrists','Hands','Waist','Legs','Feet','Ring 1','Ring 2','Trinket 1','Trinket 2','Main Hand','Off Hand','Wand'];
const seed={active:'Sttechii',characters:{
 Sttechii:{name:'Sttechii',server:'Mankrik',version:'Classic Era',race:'Human',class:'Warlock',spec:'Affliction',level:48,zone:'Tanaris',pet:'Succubus / Imp for dungeons',goal:'ZF, Tanaris grind, quest routing, AH profit',gold:950,professions:{Tailoring:295,Herbalism:132},stats:{health:1718,mana:3280,stamina:103,intellect:164,spirit:141,spellPower:66,shadowDamage:90,fireDamage:16,crit:5.31,hit:0},gear:{Head:'Bad Mojo Mask',Neck:'Triune Amulet',Shoulders:'Shadoweave Shoulders',Back:'Ironhide Cloak of the Eagle',Chest:'Dreamweave Vest',Wrists:'Shadowy Bracers',Hands:'Dreamweave Gloves',Waist:'Shadowy Belt',Legs:'Shadoweave Pants',Feet:'Southsea Mojo Boots', 'Ring 1':'Underworld Band','Ring 2':'Band of the Unicorn','Trinket 1':'Carrot on a Stick','Trinket 2':'', 'Main Hand':'Hypnotic Blade','Off Hand':'Orb of Dar\'Orahil',Wand:'Jaina\'s Firestarter'},quests:'Tanaris grind / ZF prep / Hinterlands and Feralas next',notes:'High gold from Plans: Steel Weapon Chain. Selling Runecloth Bags heavily.'},
 Frrank:{name:'Frrank',server:'Mankrik',version:'Classic Era',race:'Human',class:'Warrior',spec:'Arms/Fury',level:60,zone:'',pet:'',goal:'Warrior gear tracking and route support',gold:0,professions:{},stats:{health:0,mana:0,stamina:0,intellect:0,spirit:0,spellPower:0,shadowDamage:0,fireDamage:0,crit:0,hit:0},gear:{Head:'Lionheart Helm',Neck:'Onyxia Tooth Pendant',Shoulders:'Conqueror\'s Spaulders',Back:'Might of the Tribe',Chest:'Plated Abomination Ribcage',Waist:'Onslaught Girdle',Hands:'Gauntlets of Annihilation','Ring 1':'Master Dragonslayer\'s Ring','Ring 2':'Signet Ring of the Bronze Dragonflight','Trinket 1':'Hand of Justice','Trinket 2':'Blackhand\'s Breadth'},quests:'',notes:'Raid-tested Warrior profile placeholder.'}
}};
const spellBook=[
 {cat:'Core Affliction damage',name:'Corruption',mana:290,base:666,dur:18,tick:3,coef:1.0,type:'dot',school:'shadow',use:'Primary DoT. Great DPM if most ticks land.'},
 {cat:'Core Affliction damage',name:'Curse of Agony',mana:215,base:1044,dur:24,tick:2,coef:1.2,type:'dot',school:'shadow',use:'Best on long-lived mobs. Bad if target dies early.'},
 {cat:'Core Affliction damage',name:'Siphon Life',mana:205,base:450,dur:30,tick:3,coef:0.5,type:'dotheal',school:'shadow',use:'Efficiency/sustain spell for durable mobs.'},
 {cat:'Drain spells',name:'Drain Life',mana:255,base:530,dur:5,tick:1,coef:0.5,type:'channel',school:'shadow',use:'Damage plus healing. Great leveling value.'},
 {cat:'Direct damage',name:'Shadow Bolt',mana:300,base:510,dur:0,tick:0,coef:.857,type:'direct',school:'shadow',cast:3,use:'Fast damage, best on Nightfall proc or elites.'},
 {cat:'Fire spells',name:'Immolate',mana:295,base:560,dur:15,tick:3,coef:.65,type:'dot',school:'fire',use:'Useful but weaker in Shadow-heavy gear.'},
 {cat:'Curses',name:'Curse of Elements',mana:150,base:0,dur:300,tick:0,coef:0,type:'utility',school:'shadow',use:'Use on bosses when Mage is blasting.'},
 {cat:'Curses',name:'Curse of Tongues',mana:110,base:0,dur:30,tick:0,coef:0,type:'utility',school:'shadow',use:'Use on dangerous casters.'},
 {cat:'Utility',name:'Fear',mana:150,base:0,dur:20,tick:0,coef:0,type:'utility',school:'shadow',use:'Emergency only in dungeons/caves.'},
 {cat:'Pets/demons',name:'Imp',mana:0,base:0,dur:0,tick:0,coef:0,type:'pet',school:'fire',use:'Blood Pact + Dark Pact battery.'},
 {cat:'Pets/demons',name:'Succubus',mana:0,base:0,dur:0,tick:0,coef:0,type:'pet',school:'physical',use:'Best solo kill-speed pet.'},
 {cat:'Cooldowns',name:'Soulstone',mana:450,base:0,dur:1800,tick:0,coef:0,type:'utility',school:'shadow',use:'Dungeon safety.'},
 {cat:'Soul shard spells',name:'Healthstone',mana:0,base:0,dur:0,tick:0,coef:0,type:'utility',school:'shadow',use:'Keep group stocked.'},
 {cat:'Rarely used / situational',name:'Banish',mana:150,base:0,dur:30,tick:0,coef:0,type:'utility',school:'shadow',use:'Elementals/demons.'}
];
function n(v){return Number(v)||0} function fmt(v){return Math.round(v*10)/10} function load(){try{return JSON.parse(localStorage.getItem(LS))||seed}catch{return seed}} function save(s){localStorage.setItem(LS,JSON.stringify(s))}
function spellDmg(s,stats,dur){const sp=(s.school==='fire'?n(stats.fireDamage):n(stats.shadowDamage))+n(stats.spellPower);let raw=n(s.base)+sp*n(s.coef); if(s.type==='dot'||s.type==='dotheal'||s.type==='channel'){const ticks=s.tick?Math.min(Math.floor(dur/s.tick),Math.floor(s.dur/s.tick)):0; const max=s.tick?Math.floor(s.dur/s.tick):1; raw=raw*(max?ticks/max:1)} return Math.max(0,raw)}
function App(){const [state,setState]=useState(load());const [tab,setTab]=useState('Dashboard');useEffect(()=>save(state),[state]);const c=state.characters[state.active];function upd(p){setState(s=>({...s,characters:{...s.characters,[s.active]:{...s.characters[s.active],...p}}}))}function updStats(k,v){upd({stats:{...c.stats,[k]:v}})}function updGear(k,v){upd({gear:{...c.gear,[k]:v}})}const tabs=['Dashboard','Gear','Encounter','Spellbook','Screenshot Upload','Quest Router','Gear Compare','AH Profit'];return <div className="wrap"><div className="top"><div className="brand"><h1>Classic Party Trainer</h1><p>WoW Classic Era character dashboard, routing, calculators and profession tools.</p></div><div className="bar"><select value={state.active} onChange={e=>setState({...state,active:e.target.value})}>{Object.keys(state.characters).map(x=><option key={x}>{x}</option>)}</select><button onClick={()=>{const name=prompt('Character name?'); if(!name)return; setState(s=>({...s,active:name,characters:{...s.characters,[name]:{name,server:'Mankrik',version:'Classic Era',race:'',class:'',spec:'',level:1,zone:'',pet:'',goal:'',gold:0,professions:{},stats:{},gear:{},quests:'',notes:''}}}))}}>Add Character</button><button onClick={()=>navigator.clipboard.writeText(JSON.stringify(state,null,2))}>Export JSON</button><button onClick={()=>{const txt=prompt('Paste exported JSON'); if(txt)try{setState(JSON.parse(txt))}catch(e){alert('Invalid JSON')}}}>Import JSON</button></div></div><div className="tabs">{tabs.map(t=><button key={t} className={'tab '+(tab===t?'active':'')} onClick={()=>setTab(t)}>{t}</button>)}</div>{tab==='Dashboard'&&<Dashboard c={c} upd={upd} updStats={updStats}/>} {tab==='Gear'&&<Gear c={c} updGear={updGear}/>} {tab==='Encounter'&&<Encounter c={c}/>} {tab==='Spellbook'&&<Spellbook/>} {tab==='Screenshot Upload'&&<Screenshot c={c} upd={upd}/>} {tab==='Quest Router'&&<QuestRouter c={c} upd={upd}/>} {tab==='Gear Compare'&&<GearCompare c={c}/>} {tab==='AH Profit'&&<AHProfit/>}</div>}
function Dashboard({c,upd,updStats}){return <div className="grid"><div className="card span4"><h2>{c.name}</h2><div className="cols"><div><label>Race</label><input value={c.race||''} onChange={e=>upd({race:e.target.value})}/></div><div><label>Class</label><input value={c.class||''} onChange={e=>upd({class:e.target.value})}/></div><div><label>Level</label><input value={c.level||''} onChange={e=>upd({level:e.target.value})}/></div><div><label>Spec</label><input value={c.spec||''} onChange={e=>upd({spec:e.target.value})}/></div><div><label>Zone</label><input value={c.zone||''} onChange={e=>upd({zone:e.target.value})}/></div><div><label>Pet / stance</label><input value={c.pet||''} onChange={e=>upd({pet:e.target.value})}/></div></div><label>Current goal</label><textarea value={c.goal||''} onChange={e=>upd({goal:e.target.value})}/></div><div className="card span4"><h2>Stats</h2>{['health','mana','stamina','intellect','spirit','spellPower','shadowDamage','fireDamage','crit','hit'].map(k=><div className="stat" key={k}><span>{k}</span><input className="right" value={c.stats?.[k]??''} onChange={e=>updStats(k,e.target.value)}/></div>)}</div><div className="card span4"><h2>Professions / Notes</h2><div className="stat"><span>Gold</span><input className="right" value={c.gold||0} onChange={e=>upd({gold:e.target.value})}/></div><label>Professions</label><textarea value={Object.entries(c.professions||{}).map(([k,v])=>`${k}: ${v}`).join('\n')} onChange={e=>{const p={};e.target.value.split('\n').forEach(l=>{const [a,b]=l.split(':');if(a)p[a.trim()]=b?.trim()||''});upd({professions:p})}}/><label>Notes</label><textarea value={c.notes||''} onChange={e=>upd({notes:e.target.value})}/></div><div className="card span12"><h2>Next Best Actions</h2><div className="quest"><b>S Tier:</b> Fill second trinket slot. Nifty Stopwatch if not done; keep Carrot equipped for travel.</div><div className="quest"><b>A Tier:</b> ZF / Tanaris / Hinterlands / Feralas progression. Keep farming XP where kills are nonstop.</div><div className="quest"><b>A Tier:</b> Continue Runecloth Bag market while margins are strong. Keep Mooncloth cooldown moving.</div><div className="quest"><b>B Tier:</b> Watch for weapon/offhand/ring upgrades, but avoid overpaying for small AH sidegrades.</div></div></div>}
function Gear({c,updGear}){return <div className="grid"><div className="card span12"><h2>Gear by Slot</h2><div className="geargrid">{slots.map(s=><div className="gearitem" key={s}><label>{s}</label><input value={c.gear?.[s]||''} onChange={e=>updGear(s,e.target.value)} placeholder="Empty"/></div>)}</div></div></div>}
function Encounter({c}){const [m,setM]=useState({level:48,hp:2400,count:1,duration:30,shadowRes:0,miss:6,crit:c.stats?.crit||5,nightfall:true,pet:true,petDps:32,wand:true,wandDps:39});const stats=c.stats||{};const useful=spellBook.filter(s=>['dot','dotheal','channel','direct'].includes(s.type));const rows=useMemo(()=>useful.map(s=>{const dmg=spellDmg(s,stats,n(m.duration));const after=dmg*(1-n(m.miss)/100)*(1-n(m.shadowRes)/100);return {...s,dmg:after,dpm:s.mana?after/s.mana:0,dps:after/Math.max(1,n(m.duration))}}).sort((a,b)=>b.dpm-a.dpm),[m,stats]);const seq=m.count==1?'Curse of Agony → Corruption → Siphon Life → Drain Life / Nightfall Shadow Bolt':m.count<=3?'Mob 1 Agony+Corruption, Mob 2 Corruption+Agony, add Siphon Life on durable targets, Drain Life as tanking':'Corruption spread first, Agony only on mobs living 18s+, Siphon Life on the kill target, wand/Drain to finish';const totalSpell=rows.slice(0,Math.min(3,rows.length)).reduce((a,r)=>a+r.dmg,0)*n(m.count);const pet=(m.pet?n(m.petDps)*n(m.duration):0);const wand=(m.wand?n(m.wandDps)*Math.max(0,n(m.duration)-10):0);const total=totalSpell+pet+wand;return <div className="grid"><div className="card span4"><h2>Encounter Inputs</h2>{Object.entries(m).map(([k,v])=>typeof v==='boolean'?<div className="stat" key={k}><span>{k}</span><input type="checkbox" checked={v} onChange={e=>setM({...m,[k]:e.target.checked})}/></div>:<div key={k}><label>{k}</label><input value={v} onChange={e=>setM({...m,[k]:e.target.value})}/></div>)}</div><div className="card span8"><h2>Recommended Sequence</h2><div className="note">{seq}</div><div className="cols"><div className="stat"><span>Estimated total damage</span><b>{fmt(total)}</b></div><div className="stat"><span>Time to kill estimate</span><b>{fmt((n(m.hp)*n(m.count))/Math.max(1,total/n(m.duration)))} sec</b></div><div className="stat"><span>Expected Nightfall value</span><b>{m.nightfall?'On: prioritize procs':'Off'}</b></div><div className="stat"><span>Best DPM spell</span><b>{rows[0]?.name}</b></div></div><h3>Spell efficiency</h3><table><thead><tr><th>Spell</th><th>Damage</th><th>DPM</th><th>Use</th></tr></thead><tbody>{rows.map(r=><tr key={r.name}><td>{r.name}</td><td>{fmt(r.dmg)}</td><td>{fmt(r.dpm)}</td><td>{r.use}</td></tr>)}</tbody></table></div></div>}
function Spellbook(){const cats=[...new Set(spellBook.map(s=>s.cat))];return <div className="grid">{cats.map(cat=><div className="card span6" key={cat}><h2>{cat}</h2><table><tbody>{spellBook.filter(s=>s.cat===cat).map(s=><tr key={s.name}><td><b>{s.name}</b><div className="mini">{s.use}</div></td><td className="right">Mana {s.mana}</td></tr>)}</tbody></table></div>)}</div>}
function Screenshot({c,upd}){const [img,setImg]=useState(''),[text,setText]=useState(''),[busy,setBusy]=useState(false);async function ocr(file){setBusy(true);const url=URL.createObjectURL(file);setImg(url);try{const r=await Tesseract.recognize(file,'eng');setText(r.data.text)}catch(e){setText('OCR failed. Enter manually.')}setBusy(false)}function apply(){let patch={notes:(c.notes||'')+'\n\nScreenshot OCR:\n'+text};const lvl=text.match(/Level\s*(\d+)/i);if(lvl)patch.level=lvl[1];const hp=text.match(/Health\D+(\d+)/i);const mana=text.match(/Mana\D+(\d+)/i);if(hp||mana)patch.stats={...c.stats,health:hp?hp[1]:c.stats?.health,mana:mana?mana[1]:c.stats?.mana};upd(patch)}return <div className="grid"><div className="card span6"><h2>Screenshot Upload</h2><input type="file" accept="image/*" onChange={e=>e.target.files[0]&&ocr(e.target.files[0])}/>{busy&&<p className="gold">Reading screenshot...</p>}{img&&<img className="imgprev" src={img}/>}</div><div className="card span6"><h2>OCR / Manual Review</h2><textarea value={text} onChange={e=>setText(e.target.value)} placeholder="OCR results or manual notes..."/><button onClick={apply}>Save OCR text to character notes</button><p className="mini">OCR is a first pass. Always review and overwrite manually.</p></div></div>}
function QuestRouter({c,upd}){const [q,setQ]=useState(c.quests||'');const lines=q.split('\n').filter(Boolean);function bucket(x){const s=x.toLowerCase();if(s.includes('uldaman'))return'Dungeon stack';if(s.includes('zul')||s.includes('zf')||s.includes('zulfarrak'))return'ZF prep';if(s.includes('elite')||s.includes('+'))return'Group';if(s.includes('complete'))return'Turn in';if(s.includes('tanaris')||s.includes('wastewander')||s.includes('pirate'))return'Do now';return'Review'}const groups={};lines.forEach(l=>{const b=bucket(l);groups[b]=groups[b]||[];groups[b].push(l)});return <div className="grid"><div className="card span5"><h2>Quest Log Text</h2><textarea value={q} onChange={e=>setQ(e.target.value)} placeholder="Paste quest log or OCR text here..."/><button onClick={()=>upd({quests:q})}>Save Quest Text</button></div><div className="card span7"><h2>Route Buckets</h2>{Object.entries(groups).map(([b,arr])=><div key={b}><h3>{b}</h3>{arr.map(x=><div className="quest" key={x}>{x}<br/><span className="tag">{b}</span></div>)}</div>)}</div></div>}
function GearCompare(){const [a,setA]=useState({shadow:0,spell:0,stam:0,int:0,spirit:0,hit:0,crit:0});const [b,setB]=useState({shadow:0,spell:0,stam:0,int:0,spirit:0,hit:0,crit:0});function score(x){return n(x.shadow)*1.3+n(x.spell)*1.1+n(x.stam)*.35+n(x.int)*.25+n(x.spirit)*.1+n(x.hit)*2+n(x.crit)*1.5}const diff=score(b)-score(a);const tier=diff>18?'S Tier huge upgrade':diff>8?'A Tier strong upgrade':diff>2?'B Tier useful':diff>-2?'C Tier sidegrade':'Skip / downgrade';function fields(obj,set){return ['shadow','spell','stam','int','spirit','hit','crit'].map(k=><div key={k}><label>{k}</label><input value={obj[k]} onChange={e=>set({...obj,[k]:e.target.value})}/></div>)}return <div className="grid"><div className="card span4"><h2>Current Item</h2>{fields(a,setA)}</div><div className="card span4"><h2>New Item</h2>{fields(b,setB)}</div><div className="card span4"><h2>Priority Score</h2><div className="stat"><span>Current</span><b>{fmt(score(a))}</b></div><div className="stat"><span>New</span><b>{fmt(score(b))}</b></div><div className="stat"><span>Difference</span><b className={diff>=0?'good':'bad'}>{fmt(diff)}</b></div><h3 className="gold">{tier}</h3><p className="mini">Warlock weighting favors Shadow/Spell damage, Stamina, Intellect, Hit and Crit.</p></div></div>}
function AHProfit(){const [p,setP]=useState({runecloth:.8,rugged:.3,runeThread:.5,bagSale:6,mageweave:.25,silk:.08,felcloth:3,mooncloth:8,ahCut:5});function set(k,v){setP({...p,[k]:v})}const bagCost=25*n(p.runecloth)+2*n(p.rugged)+n(p.runeThread);const net=n(p.bagSale)*(1-n(p.ahCut)/100);const boltRune=5*n(p.runecloth);const boltMage=5*n(p.mageweave);const boltSilk=4*n(p.silk);const moon=n(p.mooncloth)*(1-n(p.ahCut)/100)-2*n(p.felcloth);return <div className="grid"><div className="card span4"><h2>AH Prices</h2>{Object.entries(p).map(([k,v])=><div key={k}><label>{k}</label><input value={v} onChange={e=>set(k,e.target.value)}/></div>)}</div><div className="card span8"><h2>Profit Tools</h2><div className="stat"><span>Runecloth Bag material cost</span><b>{fmt(bagCost)}g</b></div><div className="stat"><span>Runecloth Bag net sale</span><b>{fmt(net)}g</b></div><div className="stat"><span>Profit per Runecloth Bag</span><b className={net-bagCost>=0?'good':'bad'}>{fmt(net-bagCost)}g</b></div><div className="stat"><span>15 bag shopping list</span><b>375 Runecloth, 30 Rugged Leather, 15 Rune Thread</b></div><h3>Bolts</h3><div className="stat"><span>Bolt of Runecloth cost</span><b>{fmt(boltRune)}g</b></div><div className="stat"><span>Bolt of Mageweave cost</span><b>{fmt(boltMage)}g</b></div><div className="stat"><span>Bolt of Silk cost</span><b>{fmt(boltSilk)}g</b></div><h3>Mooncloth</h3><div className="stat"><span>Mooncloth cooldown profit</span><b className={moon>=0?'good':'bad'}>{fmt(moon)}g</b></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
